<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PinkApp</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-pink-100">
        
        <h1 class="text-3xl font-extrabold text-pink-600 mb-2 text-center">Welcome Back</h1>
        <p class="text-pink-400 text-center mb-8 text-sm">Please enter your details to sign in</p>
        
        <form class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-pink-900 mb-1">Email Address</label>
                <input type="email" placeholder="name@company.com" required
                       class="w-full px-4 py-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
            </div>
            
            <div>
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-semibold text-pink-900">Password</label>
                    <a href="#" class="text-xs font-bold text-pink-600 hover:text-pink-800 underline">Forgot password?</a>
                </div>
                <input type="password" placeholder="••••••••" required
                       class="w-full px-4 py-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
            </div>

            <div class="flex items-center">
                <input id="remember" type="checkbox" class="w-4 h-4 text-pink-600 border-pink-300 rounded focus:ring-pink-500">
                <label for="remember" class="ml-2 text-sm text-pink-700 cursor-pointer">Remember me</label>
            </div>

            <button type="submit" 
                    class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 transform hover:scale-[1.02] shadow-md mt-2">
                SIGN IN
            </button>

            <p class="text-center text-sm text-pink-700 mt-6">
                Don't have an account? 
                <a href="signup.html" class="font-bold text-pink-600 hover:underline">Create Account</a>
            </p>
        </form>

    </div>

</body>
</html>
