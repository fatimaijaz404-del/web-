<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PinkApp</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-pink-100">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-pink-600">Create Account</h1>
            <p class="text-pink-400 mt-2">Join our pink community today!</p>
        </div>
        
        <form 
        action="https://formspree.io/f/xlgpalkv"
        method="post"
        class="space-y-4">
                       
                
        
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-pink-900 mb-1">First Name</label>
                    <input type="text" placeholder="first name" required
                           class="w-full px-4 py-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-pink-900 mb-1">Last Name</label>
                    <input type="text" placeholder="last name" required
                           class="w-full px-4 py-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-pink-900 mb-1">Email Address</label>
                <input type="email" placeholder="jane@example.com" required
                       class="w-full px-4 py-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-pink-900 mb-1">Password</label>
                <input type="password" placeholder="••••••••" required
                       class="w-full px-4 py-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
                <p class="text-[10px] text-pink-400 mt-1">Must be at least 8 characters long.</p>
            </div>

            <div class="flex items-start mt-2">
                <div class="flex items-center h-5">
                    <input id="terms" type="checkbox" required class="w-4 h-4 text-pink-600 border-pink-300 rounded focus:ring-pink-500">
                </div>
                <label for="terms" class="ml-2 text-sm text-pink-700">
                    I agree to the <a href="#" class="font-bold text-pink-600 hover:underline">Terms and Conditions</a>
                </label>
            </div>

            <button type="submit" 
                    class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 transform hover:scale-[1.01] shadow-md mt-4">
                REGISTER NOW
            </button>

            <div class="text-center text-sm text-pink-700 mt-6 pt-4 border-t border-pink-50">
                Already have an account? 
                <a href="signin.html" class="font-bold text-pink-600 hover:underline">Sign In here</a>
            </div>
        </form>

    </div>
                  
</body>
</html>
