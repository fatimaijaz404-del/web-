<body class="bg-pink-50 text-gray-900 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-pink-200 px-4 py-2.5 fixed w-full z-50 top-0 left-0">
        <div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl">
            <a href="index.html" class="flex items-center">
                <span class="self-center text-2xl font-semibold whitespace-nowrap text-pink-600">🌸 MY WEBSITE </span>
            </a>
            <div class="hidden justify-between items-center w-full lg:flex lg:w-auto lg:order-1" id="mobile-menu-2">
                <ul class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0">
                    <li><a href="http://127.0.0.1:5500/index.html" class="block py-2 pr-4 pl-3 text-gray-700 hover:text-pink-700 lg:p-0">Home</a></li>

                    <li><a href="http://127.0.0.1:5500/assets/src/pages/contact/contact.html" class="block py-2 pr-4 pl-3 text-white rounded bg-pink-600 lg:bg-transparent lg:text-pink-700 lg:p-0">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-12 px-4 flex-grow">
        <div class="max-w-screen-md mx-auto">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-pink-700">Get In Touch</h2>
                <p class="text-pink-400 mt-2 font-medium">Have a question about my first website? Send me a message!</p>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-pink-100">
                <form action="#" class="space-y-4">
                    <div>
                        <label class="block mb-2 text-sm font-bold text-pink-900">Your Email</label>
                        <input type="email" class="bg-pink-50 border border-pink-200 text-gray-900 text-sm rounded-xl focus:ring-pink-500 focus:border-pink-500 block w-full p-2.5" placeholder="name@pinkapp.com" required>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-bold text-pink-900">Subject</label>
                        <input type="text" class="bg-pink-50 border border-pink-200 text-gray-900 text-sm rounded-xl focus:ring-pink-500 focus:border-pink-500 block w-full p-2.5" placeholder="Let me know how I can help" required>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block mb-2 text-sm font-bold text-pink-900">Your Message</label>
                        <textarea rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-pink-50 rounded-xl border border-pink-200 focus:ring-pink-500 focus:border-pink-500" placeholder="Leave a comment..."></textarea>
                    </div>
                    <button type="submit" class="py-3 px-5 w-full text-sm font-bold text-center text-white rounded-xl bg-pink-600 hover:bg-pink-700 focus:ring-4 focus:outline-none focus:ring-pink-300 transition-colors">
                        Send Message
                    </button>
                </form>
            </div>

            <div class="mt-10 flex justify-center space-x-6 text-pink-600 font-bold">
                <a href="#" class="hover:text-pink-800 transition-colors">Instagram</a>
                <a href="#" class="hover:text-pink-800 transition-colors">Twitter</a>
                <a href="#" class="hover:text-pink-800 transition-colors">LinkedIn</a>
            </div>

        </div>
    </section>

    <footer class="bg-white border-t border-pink-100 mt-auto">
        <div class="w-full max-w-screen-xl mx-auto p-6 text-center">
            <span class="text-pink-600 font-bold">PinkApp © 2026 | My First Website</span>
        </div>
    </footer>
